# Environment for the original four models (Llama-3.x / Qwen2.5).
# Linux + NVIDIA GPU only (vLLM and bitsandbytes do not support macOS).
# For Qwen3.5-9B / Qwen3.8-27B use environment_qwen35.yml instead.
name: pvminer
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.9.0
      - transformers==4.57.6
      - vllm==0.11.2
      - peft==0.18.1
      - accelerate==1.13.0
      - bitsandbytes==0.49.2
      - datasets==4.3.0
      - huggingface_hub==0.36.2
      - tokenizers==0.22.2
      - safetensors==0.7.0
      - sentencepiece==0.2.1
      - numpy==2.2.6
      - pandas==3.0.1
      - scikit-learn==1.8.0
      - lm-eval==0.4.11
